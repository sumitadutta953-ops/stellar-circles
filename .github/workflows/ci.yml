name: CI Pipeline (Level 4 Rigor)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ---------------------------------------------------------
  # GATEWAY 1: Smart Contract Security & Quality
  # ---------------------------------------------------------
  rust-security-quality:
    name: Rust Security & Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./contracts
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: clippy, rustfmt

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./contracts -> target

      - name: Format Check
        run: cargo fmt --all -- --check

      - name: Install Cargo Audit
        run: cargo install cargo-audit

      - name: Security Audit
        run: cargo audit

      - name: Clippy Linter
        run: cargo clippy --all-targets --all-features -- -D warnings

  # ---------------------------------------------------------
  # GATEWAY 2: Smart Contract Testing & Build
  # ---------------------------------------------------------
  rust-test-build:
    name: Rust Test & Build
    runs-on: ubuntu-latest
    needs: rust-security-quality
    defaults:
      run:
        working-directory: ./contracts
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./contracts -> target

      - name: Build WASM
        run: cargo build --target wasm32v1-none --release

      - name: Run Tests
        run: cargo test --workspace

  # ---------------------------------------------------------
  # GATEWAY 3: Frontend Quality & Security
  # ---------------------------------------------------------
  frontend-quality-security:
    name: Frontend Quality & Security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Security Audit
        run: npm audit

      - name: Type Checking
        run: npx tsc --noEmit

      - name: Linting
        run: npm run lint

  # ---------------------------------------------------------
  # GATEWAY 4: Frontend Build Verification
  # ---------------------------------------------------------
  frontend-build:
    name: Frontend Build Verification
    runs-on: ubuntu-latest
    needs: frontend-quality-security
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Production Build
        run: npm run build

  # ---------------------------------------------------------
  # GATEWAY 5: End-to-End (E2E) UI Testing
  # ---------------------------------------------------------
  frontend-e2e:
    name: End-to-End UI Testing
    runs-on: ubuntu-latest
    needs: frontend-build
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Build Application for Preview
        run: npm run build

      - name: Run Playwright Tests
        run: npx playwright test
